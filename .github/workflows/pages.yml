name: Objava na GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Svaki dan u 06:00 UTC: povuci najnovije videe s kanala i ponovo objavi sajt.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Osvježi listu najnovijih videa
        run: python3 scripts/update_videos.py

      - name: Pripremi fajlove za objavu
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude 'scripts' \
            --exclude 'README.md' --exclude '.gitignore' --exclude '_site' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
